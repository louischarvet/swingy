services:
  postgres:
    image: postgres:15
    container_name: swingy-db
    environment:
      POSTGRES_DB: swingy
      POSTGRES_USER: locharve
      POSTGRES_PASSWORD: locharve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: